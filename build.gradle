buildscript {
    ext.kotlin_version = '2.0.20'
    ext.realm_version = '2.3.0'
    ext.nav_version = "2.8.5"

    // Versioning shared between :mobile and :wear so the two apps never drift.
    // See audit-report/15-release-and-distribution.md §6.
    ext.appMajor = 1
    ext.appMinor = 3
    ext.appBaseBuildNumber = 25
    ext.getAppVersionCode = { ->
        def envBuildNumber = System.getenv("BUILD_NUMBER")?.toInteger() ?: 0
        return ext.appBaseBuildNumber + (ext.appMajor * 100) + ext.appMinor + envBuildNumber
    }
    ext.getAppVersionName = { ->
        return "${ext.appMajor}.${ext.appMinor}.${ext.getAppVersionCode()}"
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath "androidx.navigation:navigation-safe-args-gradle-plugin:$nav_version"
        classpath 'com.android.tools.build:gradle:8.13.0'

        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.9.9'

        classpath 'com.google.gms:google-services:4.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:$kotlin_version"
    }
}

plugins {
    id 'io.realm.kotlin' version "$realm_version" apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
    delete rootProject.projectDir.absolutePath + "/mobile/release"
    delete rootProject.projectDir.absolutePath + "/wear/release"
}
