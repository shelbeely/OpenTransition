plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-kapt'
    id 'io.realm.kotlin'
    id 'androidx.navigation.safeargs.kotlin'
    id 'kotlin-parcelize'
    id 'com.google.devtools.ksp' version '2.0.20-1.0.25'

    id 'com.google.gms.google-services' //Should be second last
    id 'com.google.firebase.crashlytics' // Should be last
}

plugins.withId("com.android.application") {
    android.buildTypes.debug.ext.enableCrashlytics = false
}

def major = rootProject.ext.appMajor
def minor = rootProject.ext.appMinor

def getVersionCode = { -> rootProject.ext.getAppVersionCode() }

def getVersionName = { -> rootProject.ext.getAppVersionName() }

// Detect whether a release build task is on the requested task graph.
// Used to fail-loud when the release keystore is missing instead of
// silently signing a "release" artefact with the debug keystore.
// See audit-report/15-release-and-distribution.md §3.
def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    it.contains('Release') || it.endsWith(':bundleRelease') || it.endsWith(':assembleRelease')
}

android {
    compileSdk 36
    
    defaultConfig {
        applicationId "com.shelbeely.opentransition"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode getVersionCode()
        versionName getVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Export Room schemas so future migrations can be reasoned about.
        // See audit-report/07-issues-and-bugs.md ISSUE-006.
        ksp {
            arg("room.schemaLocation", "$projectDir/schemas".toString())
            arg("room.incremental", "true")
        }
    }

    signingConfigs {
        def debugKey = file("${rootDir.getAbsolutePath()}/keys/debug-keystore.jks")
        debug {
            storeFile = debugKey
            storePassword = "debugkey"
            keyAlias = "transtracks"
            keyPassword = "debugkey"
        }
        release {
            def releaseKey = file("${rootDir.getAbsolutePath()}/keys/release-keystore.jks")
            def storePass = System.getenv("STORE_PASS")
            def alias = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASS")

            if (isReleaseBuildRequested) {
                // Fail loudly so a misconfigured release build cannot silently
                // produce a debug-signed AAB that looks legitimate.
                if (!releaseKey.exists()) {
                    throw new GradleException(
                        "Release keystore missing at ${releaseKey.absolutePath}. " +
                        "Provide keys/release-keystore.jks (CI injects it from KEYSTORE_64)."
                    )
                }
                if (!storePass || !alias || !keyPass) {
                    throw new GradleException(
                        "Release signing requires STORE_PASS, KEY_ALIAS, and KEY_PASS env vars."
                    )
                }
            }

            // Fall back to debug values for non-release task graphs (e.g. Studio
            // sync, lint, unit tests) so configuration does not fail there.
            storeFile = releaseKey.exists() ? releaseKey : debugKey
            storePassword = storePass ?: "debugkey"
            keyAlias = alias ?: "transtracks"
            keyPassword = keyPass ?: "debugkey"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        buildTypes.each {
            it.resValue 'string', 'ADS_APP_ID', getSecretString('ADS_APP_ID')
            it.buildConfigField 'String', 'CODE_SALT', '"' + getSecretString('CODE_SALT') + '"'
        }

        debug {
            signingConfig signingConfigs.debug

            //Test Ad Ids
            it.resValue 'string', 'ADS_GALLERY_AD_ID', "ca-app-pub-3940256099942544/9214589741"
            it.resValue 'string', 'ADS_HOME_AD_ID', "ca-app-pub-3940256099942544/9214589741"
            it.resValue 'string', 'ADS_MILESTONES_AD_ID', "ca-app-pub-3940256099942544/9214589741"
            it.resValue 'string', 'ADS_SETTINGS_AD_ID', "ca-app-pub-3940256099942544/9214589741"
        }

        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            //Real Ad Ids
            it.resValue 'string', 'ADS_GALLERY_AD_ID', getSecretString('ADS_GALLERY_AD_ID')
            it.resValue 'string', 'ADS_HOME_AD_ID', getSecretString('ADS_HOME_AD_ID')
            it.resValue 'string', 'ADS_MILESTONES_AD_ID', getSecretString('ADS_MILESTONES_AD_ID')
            it.resValue 'string', 'ADS_SETTINGS_AD_ID', getSecretString('ADS_SETTINGS_AD_ID')
        }
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    lint {
        // Fail CI on lint errors rather than silently producing a report.
        // See audit-report/07-issues-and-bugs.md ISSUE-026.
        abortOnError true
        // Disable checks that are noisy / not actionable in this project.
        disable 'GradleDependency', 'NewerVersionAvailable'
    }
    namespace 'com.shelbeely.opentransition'
}

dependencies {
    implementation project(':shared')
    
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'

    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'

    // Jetpack Compose
    def composeBom = platform('androidx.compose:compose-bom:2025.05.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Coil 3 — Compose-native image loading
    implementation 'io.coil-kt.coil3:coil-compose:3.1.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.1.0'

    def arch_version = "2.2.0"
    testImplementation "androidx.arch.core:core-testing:$arch_version"

    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.10.1'

    def lifecycle_version = "2.8.7"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-common-java8:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    testImplementation "androidx.lifecycle:lifecycle-runtime-testing:$lifecycle_version"

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.exifinterface:exifinterface:1.3.6'
    
    // Biometric authentication
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // Security library for encrypted shared preferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // Room + SQLCipher for encrypted database
    def room_version = "2.6.1"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"
    
    // SQLCipher for database encryption
    implementation "net.zetetic:android-database-sqlcipher:4.5.4"
    implementation "androidx.sqlite:sqlite:2.4.0"

    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    // navigation-compose is unused in this project — the app uses Navigation Component
    // with Fragments, not Compose destinations.  Removing saves ~200 KB from the AAB.
    // See audit-report/07-issues-and-bugs.md ISSUE-015.
    androidTestImplementation "androidx.navigation:navigation-testing:$nav_version"

    implementation 'com.google.android.gms:play-services-ads:22.4.0'
    implementation("com.google.android.gms:play-services-auth:20.7.0")
    
    // Wearable Data Layer for communication with Wear OS
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'

    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'com.firebaseui:firebase-ui-auth:8.0.2'

    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-analytics-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-crashlytics-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    implementation 'com.google.android.material:material:1.13.0'
    
    // Dynamic Animation for M3 Expressive spring physics
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    
    // CameraX for modern camera implementation
    def camerax_version = "1.3.1"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // ML Kit for face detection
    implementation 'com.google.mlkit:face-detection:16.1.6'

    ext.rx_binding_version = '3.1.0'
    implementation "com.jakewharton.rxbinding3:rxbinding:$rx_binding_version"
    implementation "com.jakewharton.rxbinding3:rxbinding-recyclerview:$rx_binding_version"
    implementation "com.jakewharton.rxbinding3:rxbinding-material:$rx_binding_version"
    implementation "com.jakewharton.rxbinding3:rxbinding-appcompat:$rx_binding_version"

    implementation 'com.jakewharton.rxrelay3:rxrelay:3.0.1'

    //noinspection GradleDependency 2.8 is newer than 2.71828 but the Maven is messed up
    implementation 'com.squareup.picasso:picasso:2.8'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'

    implementation 'io.reactivex.rxjava3:rxjava:3.1.8'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    implementation "io.realm.kotlin:library-base:$realm_version"

    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-rx3:1.7.3'

    testImplementation 'junit:junit:4.13.2'

    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

String getSecretString(String key) {
    Properties props = new Properties()
    props.load(new FileInputStream(file("$rootDir/secrets.properties")))
    return props[key]
}

def setGitHubOutput = task setGitHubOutput(type: Exec) {
    workingDir "${buildDir}"
    commandLine 'sh', '-c', "echo \"VERSION_NAME=${getVersionName()}\" >> \"\$GITHUB_OUTPUT\""
    doLast {
        println "Output VERSION_NAME set to '${getVersionName()}'"
    }
}

afterEvaluate {
    bundleRelease.configure { finalizedBy setGitHubOutput }
}