name: opentransition
description: A transition tracking application for transgender people with photo tracking and milestone management.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.8
  
  # State Management
  provider: ^6.1.2
  
  # Storage
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  sqflite: ^2.3.3+1
  idb_shim: ^2.4.1+1
  
  # Media
  image_picker: ^1.1.2
  image: ^4.2.0
  
  # File handling
  archive: ^3.6.1
  file_picker: ^8.1.2
  
  # Utilities
  intl: ^0.19.0
  uuid: ^4.5.0
  crypto: ^3.0.5
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  # Add app icons
  # assets:
  #   - assets/images/
