name: "Copilot Setup Steps"

# Run automatically when this file changes (for easy validation), and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job MUST be named `copilot-setup-steps` to be picked up by Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Common Android build environment: JDK 17, SDK, CLI (cached), secrets, etc.
      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          secrets-properties-b64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      # KVM acceleration is required for the Android emulator to run at usable
      # speed on GitHub-hosted ubuntu runners.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # libpulse0: required by the QEMU binary (emulator dies without it).
      # libxcb-cursor0: required by Qt ≥6.5 xcb platform plugin.
      # Xvfb: virtual framebuffer for headless emulator initialisation.
      - name: Install emulator system dependencies
        run: sudo apt-get update && sudo apt-get install -y libpulse0 libxcb-cursor0 xvfb

      # Cache the emulator system image and AVD so the large image download is
      # skipped on warm runs (~3–5 min saved per session).
      - name: Cache Android emulator system image and AVD
        id: cache-emulator
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/system-images
            ~/.android/avd/medium_phone.avd
            ~/.android/avd/medium_phone.ini
          key: emulator-medium_phone-${{ runner.os }}-v1

      # Create the AVD only when the cache doesn't already have it.
      - name: Create Android emulator
        if: steps.cache-emulator.outputs.cache-hit != 'true'
        run: android emulator create --profile=medium_phone

      # Pre-warm the Gradle dependency cache so the agent's first real build
      # resolves no dependencies from the network.
      - name: Pre-warm Gradle dependency cache
        run: ./gradlew :mobile:dependencies --quiet
