name: "Copilot Setup Steps"

# Run automatically when this file changes (for easy validation), and allow
# manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # Job MUST be named `copilot-setup-steps` to be picked up by Copilot cloud agent.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # JDK 17 is required by AGP 8+ and matches the rest of the CI pipeline.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Install Android SDK command-line tools so the agent can run avdmanager,
      # sdkmanager, etc. without guesswork.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # KVM acceleration is required for the Android emulator to run at usable
      # speed on GitHub-hosted ubuntu runners.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Android CLI is a single binary that gives agents a clean interface for
      # SDK management, project creation, and emulator control.
      # Download URL: https://developer.android.com/tools/agents/android-cli/archive
      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o android
          chmod +x android
          sudo mv android /usr/local/bin/android

      # Installs the android-cli skill into the agent context so Copilot
      # understands all available CLI commands and their best practices.
      - name: Init Android CLI for agent
        run: android init

      # Create a default medium_phone virtual device that the agent can deploy
      # to and interact with during the session.
      - name: Create Android emulator
        run: android emulator create --profile=medium_phone

      # Start the emulator in the background before Copilot begins work so it
      # is immediately available. We wait for a full boot before proceeding.
      - name: Start Android emulator
        run: |
          nohup android emulator start medium_phone > /tmp/emulator.log 2>&1 &
          echo "Waiting for emulator to come online..."
          adb wait-for-device
          echo "Waiting for boot to complete..."
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q "1"; do sleep 3; done'
          echo "Emulator is ready"

      # Gradle requires local.properties to locate the Android SDK.
      - name: Generate local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      # Stub secrets so the build can run without real credentials.
      # Real secrets are injected from the `copilot` environment when available.
      - name: Prepare secrets.properties
        env:
          SECRETS_PROPERTIES_B64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
        run: bash .github/ci-scripts/prepare-secrets.sh

      # Stub google-services.json with safe dummy values so Firebase plugins
      # don't fail the configuration phase.
      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "Creating dummy google-services.json for agent environment"
            mkdir -p mobile
            cat > mobile/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "firebase_url": "https://test.firebaseio.com",
              "project_id": "test-project",
              "storage_bucket": "test-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abc123",
                  "android_client_info": {
                    "package_name": "com.shelbeely.opentransition"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy-Key-For-Build-Purposes"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            bash .github/ci-scripts/prepare-google-services.sh
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      # Pre-warm the Gradle dependency cache so the agent's first real build
      # resolves no dependencies from the network.
      - name: Pre-warm Gradle dependency cache
        run: ./gradlew :mobile:assembleDebug --dry-run
