name: "Copilot Setup Steps"

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/android-setup/action.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml
      - .github/actions/android-setup/action.yml

jobs:
  # Job MUST be named `copilot-setup-steps` or Copilot cloud agent will not use it.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # JDK 17 is the safe default for AGP 8+ projects.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle action restores and saves important Gradle caches automatically.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Cache your custom Android CLI download directory.
      - name: Cache Android CLI
        uses: actions/cache@v4
        with:
          path: ~/.cache/android-cli
          key: android-cli-${{ runner.os }}-v1
          restore-keys: |
            android-cli-${{ runner.os }}-

      # Common Android setup path.
      # Your local composite action can decide whether to do the heavy CLI init.
      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          secrets-properties-b64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON }}
          init-android-cli: ${{ vars.INIT_ANDROID_CLI || 'false' }}

      # Optional emulator path. Enable by setting this repository environment variable:
      # Settings -> Environments -> copilot -> Variables -> ENABLE_ANDROID_EMULATOR=true
      - name: Enable KVM group perms
        if: ${{ vars.ENABLE_ANDROID_EMULATOR == 'true' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator system dependencies
        if: ${{ vars.ENABLE_ANDROID_EMULATOR == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0 libxcb-cursor0 xvfb

      - name: Cache Android emulator system image and AVD
        id: cache-emulator
        if: ${{ vars.ENABLE_ANDROID_EMULATOR == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/system-images
            ~/.android/avd/medium_phone.avd
            ~/.android/avd/medium_phone.ini
          key: emulator-medium_phone-${{ runner.os }}-v1
          restore-keys: |
            emulator-medium_phone-${{ runner.os }}-

      - name: Create Android emulator
        if: ${{ vars.ENABLE_ANDROID_EMULATOR == 'true' && steps.cache-emulator.outputs.cache-hit != 'true' }}
        run: android emulator create --profile=medium_phone

      # Optional Gradle dependency warmup.
      # Enable with PREWARM_GRADLE=true in the `copilot` environment variables.
      - name: Pre-warm Gradle dependency cache
        if: ${{ vars.PREWARM_GRADLE == 'true' }}
        run: ./gradlew :mobile:dependencies --quiet
