name: UI Screenshots

on:
  workflow_dispatch:
  push:
    branches: [main, production]
    paths:
      - 'mobile/src/main/**'
      - '.github/workflows/ui-screenshots.yml'
  pull_request:
    paths:
      - 'mobile/src/main/res/layout/**'
      - 'mobile/src/main/res/values/**'
      - 'mobile/src/main/res/drawable/**'
      - 'mobile/src/main/java/**/ui/**'
      - 'mobile/src/main/java/**/widget/**'
      - '.github/workflows/ui-screenshots.yml'

concurrency:
  group: ui-screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    name: Screenshots - medium_phone

    steps:
    - name: 🚚 Checkout
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: 🤖 Android setup
      uses: ./.github/actions/android-setup
      with:
        secrets-properties-b64: ''
        google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_64 }}

    - name: 👷‍♀️ Build Debug APK
      run: ./gradlew :mobile:assembleDebug --stacktrace

    - name: 🤖 Enable KVM for Android Emulator
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: 📱 Create Android Emulator
      run: android emulator create --profile=medium_phone

    - name: 🚀 Start Android Emulator
      run: |
        android emulator start medium_phone
        android emulator wait medium_phone

    - name: 📸 Capture Screenshots
      run: |
        set -euo pipefail
        APP="com.shelbeely.opentransition"
        SHOTS="screenshots"
        mkdir -p "$SHOTS"

        # ── Android CLI helpers ───────────────────────────────────────────────
        #
        # `android layout` returns a flat JSON array; each element has:
        #   .text          — visible label
        #   .contentDesc   — accessibility description
        #   .center        — "[x,y]" centre of the bounding box  ← we use this
        #   .interactions  — ["clickable","scrollable", …]
        #
        # `android screen capture -o FILE` writes a PNG screenshot.
        # `android run --apks=APK --activity=ACTIVITY` installs + launches.

        # Return the centre coords ("x y") for the first element matching a
        # given field=value, or the empty string when nothing matches.
        center_of() {
          local field="$1" value="$2"
          android layout 2>/dev/null \
            | jq -r --arg v "$value" \
                '.[] | select(.'"$field"' == $v) | .center' \
            | head -1 \
            | tr -d '[]' | tr ',' ' '
        }

        # Tap an element by its visible text label.
        tap_text() {
          local c; c=$(center_of text "$1")
          if [ -n "$c" ]; then adb shell input tap $c; return 0; fi
          echo "⚠ text='$1' not found"; return 1
        }

        # Tap an element by its accessibility content-description.
        tap_desc() {
          local c; c=$(center_of contentDesc "$1")
          if [ -n "$c" ]; then adb shell input tap $c; return 0; fi
          echo "⚠ desc='$1' not found"; return 1
        }

        # Scroll the first scrollable element up (reveal lower content).
        scroll_up() {
          local c
          c=$(android layout 2>/dev/null \
                | jq -r '[.[] | select(.interactions | index("scrollable"))] | first | .center' \
                | tr -d '[]' | tr ',' ' ')
          [ -n "$c" ] && adb shell input swipe $c $(echo "$c" | awk '{print $1, $2-900}') 600
          sleep 1
        }

        # Scroll the first scrollable element down (return to top).
        scroll_down() {
          local c
          c=$(android layout 2>/dev/null \
                | jq -r '[.[] | select(.interactions | index("scrollable"))] | first | .center' \
                | tr -d '[]' | tr ',' ' ')
          [ -n "$c" ] && adb shell input swipe $c $(echo "$c" | awk '{print $1, $2+900}') 600
          sleep 1
        }

        back()              { adb shell input keyevent KEYCODE_BACK; sleep 1; }
        shot()              { sleep 2; android screen capture -o "$SHOTS/$1.png"; echo "✅ $1"; }
        rotate_landscape()  { adb shell settings put system user_rotation 1; sleep 4; }
        rotate_portrait()   { adb shell settings put system user_rotation 0; sleep 4; }

        # ── Install, grant permissions, launch ────────────────────────────────
        android run \
          --apks=mobile/build/outputs/apk/debug/mobile-debug.apk \
          --activity=com.shelbeely.opentransition.ui.MainActivity
        adb shell pm grant "$APP" android.permission.READ_EXTERNAL_STORAGE  || true
        adb shell pm grant "$APP" android.permission.WRITE_EXTERNAL_STORAGE || true
        adb shell pm grant "$APP" android.permission.RECORD_AUDIO           || true
        adb shell pm grant "$APP" android.permission.CAMERA                 || true
        sleep 5

        # ── Group 1 · First launch & Home ─────────────────────────────────────
        # 01 — whatever appears first (welcome dialog on a fresh install)
        shot "01_launch_screen"

        tap_text "Looks Good"  2>/dev/null || true; sleep 2   # dismiss welcome
        tap_text "Risk It"     2>/dev/null || true; sleep 2   # dismiss account warning

        shot "02_home"

        tap_desc "Previous record" || true; sleep 1
        shot "03_home_previous_day"

        tap_desc "Next record" || true; sleep 1
        shot "04_home_next_day"

        # 05 — Take Photo source popup (Camera / Gallery)
        tap_desc "Take Photo"; sleep 1
        shot "05_home_photo_source_menu"
        back  # dismiss popup

        # ── Group 2 · Settings ────────────────────────────────────────────────
        tap_desc "Edit Settings"; sleep 3
        shot "06_settings_top"

        scroll_up; shot "07_settings_middle"
        scroll_up; shot "08_settings_bottom"

        scroll_down; scroll_down; sleep 1   # back to top

        tap_text "Theme:";      sleep 1; shot "09_settings_theme_dialog";      back
        tap_text "Lock Mode:";  sleep 1; shot "10_settings_lock_mode_dialog";  back
        tap_text "Start Date:"; sleep 1; shot "11_settings_start_date_picker"; back
        tap_text "Lock Delay:"; sleep 1; shot "12_settings_lock_delay_dialog"; back

        back  # back to Home

        # ── Group 3 · Milestones ──────────────────────────────────────────────
        tap_desc "Milestones"; sleep 3
        shot "13_milestones_empty"

        tap_desc "Add"; sleep 2
        shot "14_add_milestone_form"

        tap_text "Date"; sleep 1
        shot "15_add_milestone_date_picker"
        back   # dismiss date picker
        back   # back to Milestones
        back   # back to Home

        # ── Group 4 · Face Gallery ────────────────────────────────────────────
        tap_text "Face Gallery"; sleep 3
        shot "16_face_gallery_empty"

        # 17 — photo source popup (Camera / Gallery)
        tap_desc "Add"; sleep 1
        shot "17_face_gallery_source_menu"

        # 18 — Camera
        tap_text "Camera"; sleep 4
        shot "18_camera"

        tap_desc "Toggle overlay"; sleep 1
        shot "19_camera_overlay_on"

        back; sleep 2  # back to Face Gallery

        # 20 — multi-select action mode (tap Share in toolbar)
        tap_text "Share"; sleep 1
        shot "20_face_gallery_selection_mode"
        back   # end action mode
        back   # back to Home

        # ── Group 5 · Body Gallery ────────────────────────────────────────────
        tap_text "Body Gallery"; sleep 3
        shot "21_body_gallery_empty"

        tap_desc "Add"; sleep 1
        shot "22_body_gallery_source_menu"
        back   # dismiss popup
        back   # back to Home

        # ── Group 6 · Audio Gallery & Record Audio ────────────────────────────
        tap_text "Audio Gallery"; sleep 3
        shot "23_audio_gallery_empty"

        # Audio Add goes directly to Record Audio (no source popup)
        tap_desc "Add"; sleep 3
        shot "24_record_audio_idle"

        tap_desc "Record audio"; sleep 2
        shot "25_record_audio_recording"

        sleep 4
        shot "26_record_audio_waveform"

        tap_desc "Record audio"; sleep 2   # stop
        shot "27_record_audio_stopped"

        back; sleep 1   # cancel (no save) → Audio Gallery
        back            # back to Home

        # ── Group 7 · Camera from Home ────────────────────────────────────────
        tap_desc "Take Photo"; sleep 1
        tap_text "Camera";     sleep 4
        shot "28_camera_from_home"

        tap_desc "Toggle overlay"; sleep 1
        shot "29_camera_overlay_home"

        back; sleep 2  # back to Home

        # ── Group 8 · Landscape rotation ─────────────────────────────────────
        rotate_landscape
        shot "30_home_landscape"

        tap_desc "Edit Settings"; sleep 3; shot "31_settings_landscape"; back; sleep 2
        tap_desc "Milestones";    sleep 3; shot "32_milestones_landscape"; back; sleep 2
        tap_text "Face Gallery";  sleep 3; shot "33_gallery_landscape"; back; sleep 2

        tap_text "Audio Gallery"; sleep 3
        tap_desc "Add";           sleep 3; shot "34_record_audio_landscape"
        back; sleep 1   # cancel
        back; sleep 2   # back to Home

        rotate_portrait
        shot "35_home_portrait_restored"

        # ── Group 9 · Back-stack integrity ────────────────────────────────────
        tap_desc "Edit Settings"; sleep 3; back; sleep 2; shot "36_home_after_settings"
        tap_desc "Milestones";    sleep 3; back; sleep 2; shot "37_home_after_milestones"
        tap_text "Face Gallery";  sleep 3; back; sleep 2; shot "38_home_after_face_gallery"
        tap_text "Body Gallery";  sleep 3; back; sleep 2; shot "39_home_after_body_gallery"
        tap_text "Audio Gallery"; sleep 3; back; sleep 2; shot "40_home_after_audio_gallery"

        echo ""
        echo "📸 Done — $(ls "$SHOTS"/*.png | wc -l) screenshots captured."

    - name: 🛑 Stop Android Emulator
      if: always()
      run: android emulator stop medium_phone || true

    - name: 📝 Regenerate screenshots/README.md
      if: always()
      run: |
        SHOTS="screenshots"
        DATE=$(date -u '+%Y-%m-%d')
        {
          echo "# OpenTransition — UI Screenshots"
          echo ""
          echo "> 🤖 **Auto-generated** by CI on \`$DATE\` from a \`medium_phone\` emulator (API 36, debug build)."
          echo "> Re-runs on every push to \`main\` that touches UI source files."
          echo ""
          echo "---"
          echo ""
          echo "## All screenshots"
          echo ""
          echo "| # | Screenshot | Screen / State |"
          echo "|---|:---:|---|"
          for f in $(ls "$SHOTS"/*.png 2>/dev/null | sort); do
            name=$(basename "$f" .png)
            num=$(echo "$name" | grep -oE '^[0-9]+')
            label=$(echo "$name" | sed 's/^[0-9]*_//' | tr '_' ' ' | \
                      sed 's/\b\(.\)/\u\1/g')
            echo "| $num | ![$label]($name.png) | **$label** |"
          done
        } > "$SHOTS/README.md"
        echo "📝 screenshots/README.md regenerated."

    - name: 📊 Regenerate HTML report
      if: always()
      run: |
        SHOTS="screenshots"
        DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
        {
          cat << 'HTMLEOF'
        <!DOCTYPE html>
        <html lang="en">
        <head>
          <meta charset="UTF-8">
          <title>OpenTransition — UI Screenshots</title>
          <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
                   max-width: 1200px; margin: 0 auto; padding: 20px;
                   background: #0d1117; color: #c9d1d9; }
            h1 { color: #58a6ff; border-bottom: 1px solid #21262d; padding-bottom: 10px; }
            .meta { color: #8b949e; margin-bottom: 30px; }
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
            .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px;
                    overflow: hidden; }
            .card img { width: 100%; display: block; background: white; }
            .card .label { padding: 10px 14px; font-size: 13px; color: #8b949e; }
            .card .label strong { display: block; color: #c9d1d9; margin-bottom: 4px; font-size: 14px; }
          </style>
        </head>
        <body>
          <h1>📸 OpenTransition — UI Screenshots</h1>
        HTMLEOF
          echo "  <p class=\"meta\">📱 <strong>medium_phone</strong> emulator · API 36 · debug build · captured $DATE</p>"
          echo "  <div class=\"grid\">"
          for f in $(ls "$SHOTS"/*.png 2>/dev/null | sort); do
            name=$(basename "$f" .png)
            label=$(echo "$name" | sed 's/^[0-9]*_//' | tr '_' ' ' | \
                      sed 's/\b\(.\)/\u\1/g')
            echo "    <div class=\"card\">"
            echo "      <img src=\"$name.png\" alt=\"$label\" loading=\"lazy\">"
            echo "      <div class=\"label\"><strong>$label</strong>$name.png</div>"
            echo "    </div>"
          done
          echo "  </div>"
          echo "</body></html>"
        } > "$SHOTS/index.html"
        echo "📊 HTML report regenerated."

    - name: 🔄 Update README.md screenshots section
      if: always()
      run: |
        SHOTS="screenshots"
        DATE=$(date -u '+%Y-%m-%d')

        # Build the replacement block (everything between the markers, inclusive).
        NEW_BLOCK="<!-- SCREENSHOTS-START -->
        > 🤖 **Auto-generated** — refreshed by CI on \`$DATE\`.  Captured on a \`medium_phone\` emulator (API 36, debug build).

        | | | |
        |:---:|:---:|:---:|"

        # Pick six representative shots for the README preview grid.
        declare -A PICKS=(
          ["02_home.png"]="Home"
          ["06_settings_top.png"]="Settings"
          ["13_milestones_empty.png"]="Milestones"
          ["16_face_gallery_empty.png"]="Face Gallery"
          ["23_audio_gallery_empty.png"]="Audio Gallery"
          ["24_record_audio_idle.png"]="Record Audio"
        )
        KEYS=("02_home.png" "06_settings_top.png" "13_milestones_empty.png"
              "16_face_gallery_empty.png" "23_audio_gallery_empty.png" "24_record_audio_idle.png")

        ROW_IMGS="" ROW_LABELS=""
        for i in "${!KEYS[@]}"; do
          f="${KEYS[$i]}"
          lbl="${PICKS[$f]}"
          ROW_IMGS="$ROW_IMGS| ![$lbl](screenshots/$f) "
          ROW_LABELS="$ROW_LABELS| **$lbl** "
          if (( (i+1) % 3 == 0 )); then
            NEW_BLOCK="$NEW_BLOCK
        $ROW_IMGS|
        $ROW_LABELS|"
            ROW_IMGS="" ROW_LABELS=""
          fi
        done

        NEW_BLOCK="$NEW_BLOCK

        [📂 View all $(ls "$SHOTS"/*.png 2>/dev/null | wc -l) screenshots →](screenshots/README.md)
        <!-- SCREENSHOTS-END -->"

        # Inject into README.md — replace existing block or insert after ## ✨ Key Features.
        if grep -q "<!-- SCREENSHOTS-START -->" README.md; then
          python3 - <<'PY'
        import re, pathlib
        txt = pathlib.Path("README.md").read_text()
        import os
        block = os.environ.get("NEW_BLOCK", "")
        txt = re.sub(
            r"<!-- SCREENSHOTS-START -->.*?<!-- SCREENSHOTS-END -->",
            block, txt, flags=re.DOTALL)
        pathlib.Path("README.md").write_text(txt)
        PY
        else
          python3 - <<'PY'
        import re, pathlib, os
        txt = pathlib.Path("README.md").read_text()
        block = os.environ.get("NEW_BLOCK", "")
        section = "\n## 📸 Screenshots\n\n" + block + "\n"
        # Insert after the Key Features section heading
        txt = re.sub(r"(## ✨ Key Features\b)", section + r"\n\1", txt)
        pathlib.Path("README.md").write_text(txt)
        PY
        fi
        echo "📝 README.md screenshots section updated."
      env:
        NEW_BLOCK: |
          <!-- SCREENSHOTS-START -->
          Placeholder — replaced at runtime by the step above.
          <!-- SCREENSHOTS-END -->

    - name: 💾 Commit screenshots back to repo
      if: github.event_name != 'pull_request'
      run: |
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add screenshots/ README.md
        git diff --cached --quiet \
          || git commit -m "chore(screenshots): auto-update UI screenshots [skip ci]"
        git push origin HEAD:${{ github.ref_name }}

    - name: 📤 Upload Screenshots artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ui-screenshots-${{ github.run_number }}
        path: screenshots/
        retention-days: 30

    - name: 💬 Comment on PR with screenshot list
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const files = fs.readdirSync('screenshots')
            .filter(f => f.endsWith('.png'))
            .sort();

          let body = `## 📸 UI Screenshots — medium_phone\n\n`;
          body += `**${files.length} screenshots captured** on this PR.\n\n`;
          body += `**Screens covered:**\n`;
          files.forEach(f => {
            const label = f.replace('.png','').replace(/^\d+_/,'').replace(/_/g,' ');
            body += `- ✅ ${label}\n`;
          });
          body += `\n📦 Artifact: \`ui-screenshots-${{ github.run_number }}\`\n`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find(c =>
            c.user.type === 'Bot' && c.body.includes('## 📸 UI Screenshots'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body,
            });
          }
