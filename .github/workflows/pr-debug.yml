name: PR Debug Build

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o android
          chmod +x android
          sudo mv android /usr/local/bin/android

      - name: Init Android CLI
        run: android init

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare secrets.properties
        env:
          SECRETS_PROPERTIES_B64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
        run: |
          bash .github/ci-scripts/prepare-secrets.sh

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          bash .github/ci-scripts/prepare-google-services.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --stacktrace :mobile:assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transtracks-pr-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
