name: PR Debug Build

on:
  pull_request:
    branches-ignore:
      - 'copilot/**'

jobs:
  check-gradle-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gradle Wrapper Validation
        uses: gradle/wrapper-validation-action@v3

  debug:
    needs: check-gradle-wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          secrets-properties-b64: ${{ secrets.SECRETS_PROPERTIES_64 }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_64 }}

      - name: Build Debug APK
        run: ./gradlew --stacktrace :mobile:assembleDebug :wear:assembleDebug

      - name: 🔧 Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📱 Create Android Emulator
        run: android emulator create --profile=medium_phone

      - name: 🚀 Start Android Emulator
        run: |
          android emulator start medium_phone
          android emulator wait medium_phone

      - name: 🧪 Run Instrumented Tests
        run: ./gradlew --stacktrace :mobile:connectedDebugAndroidTest

      - name: 🛑 Stop Android Emulator
        if: always()
        run: android emulator stop medium_phone

      - name: 📊 Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-pr${{ github.event.pull_request.number }}
          path: mobile/build/outputs/androidTest-results/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transtracks-pr-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk

      - name: Upload Wear Debug APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opentransition-wear-pr-debug-apk
          path: wear/build/outputs/apk/debug/wear-debug.apk
