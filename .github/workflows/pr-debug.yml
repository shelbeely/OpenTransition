name: PR Debug Build

on:
  pull_request:

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android CLI
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/android -o android
          chmod +x android
          sudo mv android /usr/local/bin/android

      - name: Init Android CLI
        run: android init

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare secrets.properties
        env:
          SECRETS_PROPERTIES_B64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
        run: |
          bash .github/ci-scripts/prepare-secrets.sh

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          bash .github/ci-scripts/prepare-google-services.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --stacktrace :mobile:assembleDebug

      - name: 🔧 Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 📱 Create Android Emulator
        run: android emulator create --profile=medium_phone

      - name: 🚀 Start Android Emulator
        run: |
          android emulator start medium_phone &
          adb wait-for-device
          adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 1; done'
          echo "Emulator booted successfully"

      - name: 🧪 Run Instrumented Tests
        run: ./gradlew --stacktrace :mobile:connectedDebugAndroidTest

      - name: 🛑 Stop Android Emulator
        if: always()
        run: |
          SERIAL=$(adb devices | grep emulator | awk '{print $1}' | head -1)
          if [ -n "$SERIAL" ]; then
            android emulator stop "$SERIAL"
          fi

      - name: 📊 Upload Instrumented Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-results-pr${{ github.event.pull_request.number }}
          path: mobile/build/outputs/androidTest-results/

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transtracks-pr-debug-apk
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
