name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Prepare secrets.properties
        env:
          SECRETS_PROPERTIES_B64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
        run: |
          bash .github/ci-scripts/prepare-secrets.sh

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          bash .github/ci-scripts/prepare-google-services.sh

      - name: Prepare release keystore (optional)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          bash .github/ci-scripts/prepare-keystore.sh

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Mobile APK
        id: build_mobile_apk
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          else
            BUILD_TYPE="release"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --stacktrace :mobile:assembleDebug
            echo "apk_path=mobile/build/outputs/apk/debug/mobile-debug.apk" >> $GITHUB_OUTPUT
            echo "build_type=debug" >> $GITHUB_OUTPUT
          else
            ./gradlew --stacktrace :mobile:assembleRelease
            echo "apk_path=mobile/build/outputs/apk/release/mobile-release.apk" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
          fi

      - name: Build Wear APK
        id: build_wear_apk
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_TYPE="${{ github.event.inputs.build_type }}"
          else
            BUILD_TYPE="release"
          fi

          if [ "$BUILD_TYPE" = "debug" ]; then
            ./gradlew --stacktrace :wear:assembleDebug
            echo "apk_path=wear/build/outputs/apk/debug/wear-debug.apk" >> $GITHUB_OUTPUT
            echo "build_type=debug" >> $GITHUB_OUTPUT
          else
            ./gradlew --stacktrace :wear:assembleRelease
            echo "apk_path=wear/build/outputs/apk/release/wear-release.apk" >> $GITHUB_OUTPUT
            echo "build_type=release" >> $GITHUB_OUTPUT
          fi

      - name: Upload Mobile APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transtracks-mobile-${{ steps.build_mobile_apk.outputs.build_type }}-apk
          path: ${{ steps.build_mobile_apk.outputs.apk_path }}

      - name: Upload Wear APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: transtracks-wear-${{ steps.build_wear_apk.outputs.build_type }}-apk
          path: ${{ steps.build_wear_apk.outputs.apk_path }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.build_type == 'release')

    steps:
      - name: Download Mobile APK artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: transtracks-mobile-release-apk
          path: ./dist

      - name: Download Wear APK artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: transtracks-wear-release-apk
          path: ./dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TransTracks ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: ./dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
