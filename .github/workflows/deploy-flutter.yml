name: Deploy Flutter Web App to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_webapp/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-flutter"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages-flutter
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          channel: 'stable'
      
      - name: Install dependencies
        run: |
          cd flutter_webapp
          flutter pub get
      
      - name: Build web
        run: |
          cd flutter_webapp
          flutter build web --release --base-href="/OpenTransition-flutter/"
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './flutter_webapp/build/web'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
