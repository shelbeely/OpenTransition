name: Copilot Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'copilot/**'

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Prepare secrets.properties
        env:
          SECRETS_PROPERTIES_B64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
        run: |
          if [ -z "$SECRETS_PROPERTIES_B64" ]; then
            echo "Using example secrets.properties for testing"
            cp secrets.properties.example secrets.properties
          else
            bash .github/ci-scripts/prepare-secrets.sh
          fi

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Creating dummy google-services.json for testing"
            cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "123456789",
              "firebase_url": "https://test.firebaseio.com",
              "project_id": "test-project",
              "storage_bucket": "test-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:123456789:android:abc123",
                  "android_client_info": {
                    "package_name": "com.shelbeely.opentransition"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummy-Key-For-Build-Purposes"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          else
            bash .github/ci-scripts/prepare-google-services.sh
          fi

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew --stacktrace assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentransition-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
