name: Copilot Debug Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'copilot/**'

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Android setup
        uses: ./.github/actions/android-setup
        with:
          secrets-properties-b64: ${{ secrets.SECRETS_PROPERTIES_B64 }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Build Debug APK
        run: ./gradlew --stacktrace :mobile:assembleDebug

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opentransition-debug-${{ github.sha }}
          path: mobile/build/outputs/apk/debug/mobile-debug.apk
          retention-days: 7
