# Denylist derived from the StandWithUkraine Boycott list
# https://github.com/vshymanskyy/StandWithUkraine/blob/main/docs/Boycott.md
#
# Each entry represents a vendor/product on the boycott list, with its
# known package identifiers so the check is deterministic.
#
# Structure:
#   - name:           Human-readable vendor/product name (from upstream list)
#     reason:         Why it is on the list
#     gradle_groups:  Maven groupId prefixes to block (substring match on group)
#     gradle_plugins: Gradle plugin ID prefixes to block (substring match)
#     action_orgs:    GitHub org names used in workflow `uses:` references
#     domains:        Domain substrings to block in curl/wget URLs inside workflow steps
#
# TLD rule: all URLs/packages whose group or domain ends in .ru / .su / .by are
# caught by the domain_tld_patterns list below; vendor-specific entries here add
# coverage for vendors that operate under other TLDs.

# ---------------------------------------------------------------------------
# Top-level TLD block (Russian Federation / Soviet Union / Belarus)
# Any Maven group resolving through a .ru/.su/.by registry URL or any workflow
# curl to those TLDs is flagged.
# ---------------------------------------------------------------------------
domain_tld_patterns:
  - ".ru"
  - ".su"
  - ".by"

# ---------------------------------------------------------------------------
# Vendor-specific entries
# ---------------------------------------------------------------------------
vendors:

  - name: Yandex
    reason: Russian state-aligned technology company; all Yandex products
    gradle_groups:
      - "com.yandex"
      - "ru.yandex"
    gradle_plugins:
      - "com.yandex"
      - "ru.yandex"
    action_orgs:
      - "yandex"
    domains:
      - "yandex.com"
      - "yandex.ru"
      - "cdn.yandex.net"

  - name: VK (VKontakte)
    reason: Russian social network; VK Group companies
    gradle_groups:
      - "com.vk"
      - "ru.vk"
    gradle_plugins:
      - "com.vk"
    action_orgs:
      - "VKCOM"
      - "vkcom"
    domains:
      - "vk.com"
      - "vk.ru"

  - name: Kaspersky Lab
