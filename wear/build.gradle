plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Detect whether a release build task is on the requested task graph.
// Used to fail-loud when the release keystore is missing instead of
// silently signing a "release" artefact with the debug keystore.
def isReleaseBuildRequested = gradle.startParameter.taskNames.any {
    it.contains('Release') || it.endsWith(':bundleRelease') || it.endsWith(':assembleRelease')
}

android {
    compileSdk 36
    
    defaultConfig {
        applicationId "com.shelbeely.opentransition.wear"
        minSdk 30  // Wear OS 3.0 minimum
        targetSdk 36
        // Share versionCode/versionName with :mobile so the two apps never drift.
        // See audit-report/15-release-and-distribution.md §6.
        versionCode rootProject.ext.getAppVersionCode()
        versionName rootProject.ext.getAppVersionName()
    }

    signingConfigs {
        def debugKey = file("${rootDir.getAbsolutePath()}/keys/debug-keystore.jks")
        debug {
            storeFile = debugKey
            storePassword = "debugkey"
            keyAlias = "transtracks"
            keyPassword = "debugkey"
        }
        release {
            def releaseKey = file("${rootDir.getAbsolutePath()}/keys/release-keystore.jks")
            def storePass = System.getenv("STORE_PASS")
            def alias = System.getenv("KEY_ALIAS")
            def keyPass = System.getenv("KEY_PASS")

            if (isReleaseBuildRequested) {
                if (!releaseKey.exists()) {
                    throw new GradleException(
                        "Release keystore missing at ${releaseKey.absolutePath}. " +
                        "Provide keys/release-keystore.jks (CI injects it from KEYSTORE_64)."
                    )
                }
                if (!storePass || !alias || !keyPass) {
                    throw new GradleException(
                        "Release signing requires STORE_PASS, KEY_ALIAS, and KEY_PASS env vars."
                    )
                }
            }

            storeFile = releaseKey.exists() ? releaseKey : debugKey
            storePassword = storePass ?: "debugkey"
            keyAlias = alias ?: "transtracks"
            keyPassword = keyPass ?: "debugkey"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    
    namespace 'com.shelbeely.opentransition.wear'
}

dependencies {
    implementation project(':shared')
    
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    
    // Wear OS libraries — using play-services-wearable (replaces the deprecated
    // com.google.android.support:wearable and compileOnly wearable:wearable artifacts).
    // ITEM-59: Removed com.google.android.support:wearable:2.9.0 and
    //          compileOnly com.google.android.wearable:wearable:2.9.0.
    implementation 'androidx.wear:wear:1.3.0'
    
    // Material Design for Wear OS (Compose)
    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'
    
    // Activity and lifecycle
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Wearable Data Layer for communication
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    
    // Gson for serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
