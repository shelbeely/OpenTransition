plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def major = 1
def minor = 3

def getVersionCode = { ->
    def envBuildNumber = System.getenv("BUILD_NUMBER")?.toInteger() ?: 0
    def baseBuildNumber = 25
    return baseBuildNumber + (major * 100) + minor + envBuildNumber
}

def getVersionName = { ->
    return "$major.$minor.${getVersionCode()}"
}

android {
    compileSdk 36
    
    defaultConfig {
        applicationId "com.shelbeely.opentransition.wear"
        minSdk 30  // Wear OS 3.0 minimum
        targetSdk 36
        versionCode getVersionCode()
        versionName getVersionName()
    }

    signingConfigs {
        def debugKey = file("${rootDir.getAbsolutePath()}/keys/debug-keystore.jks")
        debug {
            storeFile = debugKey
            storePassword = "debugkey"
            keyAlias = "transtracks"
            keyPassword = "debugkey"
        }
        release {
            def releaseKey = file("${rootDir.getAbsolutePath()}/keys/release-keystore.jks")
            storeFile = releaseKey.exists() ? releaseKey : null
            storePassword = System.getenv("STORE_PASS")
            keyAlias = System.getenv("KEY_ALIAS")
            keyPassword = System.getenv("KEY_PASS")
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildFeatures {
        viewBinding true
        compose true
    }
    
    namespace 'com.shelbeely.opentransition.wear'
}

dependencies {
    implementation project(':shared')
    
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    
    // Wear OS libraries
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.support:wearable:2.9.0'
    compileOnly 'com.google.android.wearable:wearable:2.9.0'
    
    // Material Design for Wear OS (Compose)
    implementation 'androidx.wear.compose:compose-material:1.4.1'
    implementation 'androidx.wear.compose:compose-foundation:1.4.1'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.8'
    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.8'
    
    // Activity and lifecycle
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    
    // Wearable Data Layer for communication
    implementation 'com.google.android.gms:play-services-wearable:18.1.0'
    
    // Gson for serialization
    implementation 'com.google.code.gson:gson:2.10.1'
    
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}

gradle.taskGraph.whenReady { graph ->
    def isReleaseBuild = graph.hasTask(":wear:bundleRelease") || graph.hasTask(":wear:assembleRelease")
    if (isReleaseBuild) {
        def releaseKey = file("${rootDir.getAbsolutePath()}/keys/release-keystore.jks")
        if (!releaseKey.exists()) {
            throw new GradleException(
                "Release keystore not found at ${releaseKey.absolutePath}. " +
                "Inject it via the KEYSTORE_64 CI secret."
            )
        }
        if (!System.getenv("STORE_PASS")) {
            throw new GradleException("STORE_PASS environment variable is required for release builds.")
        }
        if (!System.getenv("KEY_ALIAS")) {
            throw new GradleException("KEY_ALIAS environment variable is required for release builds.")
        }
        if (!System.getenv("KEY_PASS")) {
            throw new GradleException("KEY_PASS environment variable is required for release builds.")
        }
    }
}
